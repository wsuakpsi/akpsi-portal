AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AKPsi Chapter Portal — all API Gateway-fronted Lambdas plus the nightly
  Sheets sync cron. One shared HTTP API; every function gets its own route.
  Deploy with `sam deploy --guided` from the lambdas/ directory.

Parameters:
  SupabaseUrl:
    Type: String
    Description: Supabase project URL (same as VITE_SUPABASE_URL)
  SupabaseServiceRoleKey:
    Type: String
    NoEcho: true
    Description: Supabase service role key — server-side only, never expose to the frontend
  QrCheckinJwtSecret:
    Type: String
    NoEcho: true
    Description: Secret for signing/verifying QR check-in tokens. Make up a new random string — do not reuse a Supabase-issued secret.
  GoogleServiceAccountJson:
    Type: String
    NoEcho: true
    Default: ''
    Description: Full Google service account credentials JSON, as a single-line string. Leave blank to skip Sheets sync for now.
  GoogleSheetsSpreadsheetId:
    Type: String
    Default: ''
    Description: Target spreadsheet ID. Leave blank to skip Sheets sync for now.
  EnableNightlySync:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Set to true once GoogleServiceAccountJson/GoogleSheetsSpreadsheetId are filled in, to turn on the nightly EventBridge cron.

Conditions:
  NightlySyncEnabled: !Equals [!Ref EnableNightlySync, 'true']

Globals:
  HttpApi:
    CorsConfiguration:
      AllowOrigins: ['*']
      AllowMethods: ['GET', 'POST', 'OPTIONS']
      AllowHeaders: ['Content-Type', 'Authorization']

  Function:
    Runtime: nodejs22.x
    Timeout: 15
    MemorySize: 256
    CodeUri: .
    Environment:
      Variables:
        SUPABASE_URL: !Ref SupabaseUrl
        SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
        QR_CHECKIN_JWT_SECRET: !Ref QrCheckinJwtSecret
        GOOGLE_SERVICE_ACCOUNT_JSON: !Ref GoogleServiceAccountJson
        GOOGLE_SHEETS_SPREADSHEET_ID: !Ref GoogleSheetsSpreadsheetId

Resources:
  CompleteEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/completeEvent.handler
      Events:
        Api: { Type: HttpApi, Properties: { Path: /complete-event, Method: POST } }

  CancelEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/cancelEvent.handler
      Events:
        Api: { Type: HttpApi, Properties: { Path: /cancel-event, Method: POST } }

  PostManualPointAdjustmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/postManualPointAdjustment.handler
      Events:
        Api: { Type: HttpApi, Properties: { Path: /post-adjustment, Method: POST } }

  ReviewMissingMeetingFormFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/reviewMissingMeetingForm.handler
      Events:
        Api: { Type: HttpApi, Properties: { Path: /review-form, Method: POST } }

  CalculateEndOfSemesterStandingFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/calculateEndOfSemesterStanding.handler
      Timeout: 60 # loops every active brother — give it more room than the default
      Events:
        Api: { Type: HttpApi, Properties: { Path: /calculate-standing, Method: POST } }

  CreateSemesterFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/createSemester.handler
      Events:
        Api: { Type: HttpApi, Properties: { Path: /create-semester, Method: POST } }

  GenerateCheckInTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/generateCheckInToken.handler
      Events:
        Api: { Type: HttpApi, Properties: { Path: /generate-checkin-token, Method: POST } }

  RecordAttendanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/recordAttendance.handler
      Events:
        Api: { Type: HttpApi, Properties: { Path: /record-attendance, Method: POST } }

  RecordAttendanceQrFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Same file as RecordAttendanceFunction, different exported handler —
      # QR self-check-in path (recordAttendanceViaQr) vs manual (recordAttendance).
      Handler: src/recordAttendance.qrHandler
      Events:
        Api: { Type: HttpApi, Properties: { Path: /record-attendance-qr, Method: POST } }

  RemoveAttendanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/removeAttendance.handler
      Events:
        Api: { Type: HttpApi, Properties: { Path: /remove-attendance, Method: POST } }

  RecordLateCancelFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/recordLateCancel.handler
      Events:
        Api: { Type: HttpApi, Properties: { Path: /record-late-cancel, Method: POST } }

  SyncToGoogleSheetsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/syncToGoogleSheets.handler
      Timeout: 30
      Events:
        Api: { Type: HttpApi, Properties: { Path: /sync-sheets, Method: POST } }

  NightlySheetsSyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/nightlySheetsSync.handler
      Timeout: 30
      Events:
        Nightly:
          Type: ScheduleV2
          Properties:
            State: !If [NightlySyncEnabled, 'ENABLED', 'DISABLED']
            ScheduleExpression: cron(0 7 * * ? *) # 7:00 UTC — adjust for the chapter's local nightly window

Outputs:
  ApiBaseUrl:
    Description: Base URL — append each function's path below to get the VITE_*_URL value for .env.local
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  RouteMap:
    Description: 'Path -> env var mapping (base URL + path). See DEPLOY.md for the full table.'
    Value: >
      /complete-event=VITE_COMPLETE_EVENT_URL,
      /cancel-event=VITE_CANCEL_EVENT_URL,
      /post-adjustment=VITE_POST_ADJUSTMENT_URL,
      /review-form=VITE_REVIEW_FORM_URL,
      /calculate-standing=VITE_CALCULATE_STANDING_URL,
      /create-semester=VITE_CREATE_SEMESTER_URL,
      /generate-checkin-token=VITE_GENERATE_CHECKIN_TOKEN_URL,
      /record-attendance=VITE_RECORD_ATTENDANCE_URL,
      /record-attendance-qr=VITE_RECORD_ATTENDANCE_QR_URL,
      /remove-attendance=VITE_REMOVE_ATTENDANCE_URL,
      /record-late-cancel=VITE_RECORD_LATE_CANCEL_URL,
      /sync-sheets=VITE_SHEETS_SYNC_URL
